version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client/Lexium-Frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]   # one PR for all small updates; major updates stay separate
  - package-ecosystem: "gradle"
    directory: "/server/Lexium-Backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
